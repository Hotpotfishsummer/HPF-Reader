openapi: 3.1.0
info:
  title: HPF-Reader API
  version: 0.1.0
  description: |
    HPF-Reader 服务端契约（单一权威来源）。
    服务端 Go 实现，客户端（Vue + Wails v3）由本文件生成类型化客户端。

    同步模型要点：
    - 位置一律使用 Readium Locator 信封；引擎专有定位（EPUB CFI 等）放在 locations.fragments。
    - HLC（混合逻辑时钟）字符串格式：<13位毫秒>-<8位十六进制计数器>-<8位设备ID前8位>，字典序即时间序。
    - 服务端权威合并（S1）：客户端只做 outbox + apply，不做冲突裁决。
    - 游标 cursor 由服务端单调递增分配（BIGINT IDENTITY），客户端不得自行推进。

    账号模型：**不提供公开注册**。没有 POST /v1/auth/register，
    账号只能由运维在服务器上执行 `api createuser --email ...` 创建。
    客户端只有登录入口，登录成功后才能使用书库 / 同步 / 翻译等能力。

servers:
  - url: https://api.example.com
    description: 生产
  - url: http://127.0.0.1:8080
    description: 本地开发

tags:
  - name: auth
  - name: books
  - name: sync
  - name: annotations
  - name: ai
  - name: sources
  - name: system

paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      security: []
      responses:
        '200': { description: OK }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                deviceName: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            同一「邮箱 + 来源 IP」的失败次数超限，或触发全局认证限流。
            注意：**口令正确时不会被这条规则拦下** —— 失败计数只影响错误口令，
            因此任何人无法通过连续输错口令把别人的账号锁死。
            账号级 failed_logins / locked_until 仍然写库用于审计，但不再阻断正确口令。

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: 轮换刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（吊销 refresh token）
      description: |
        允许空 body：此时只吊销 access token（客户端侧丢弃即可）。
        传 `refreshToken` 吊销该条；传 `allDevices: true` 吊销该账号全部会话。

        因为空 body 是合法请求，客户端漏传 `allDevices` 时会**静默只登出一台**。
        需要「确定让所有设备下线」时请用 `POST /v1/auth/logout-all`。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: 已登出 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/password:
    post:
      tags: [auth]
      summary: 修改口令并吊销全部会话
      description: |
        口令泄露后的**自救路径**。三个安全性质：

        1. **必须提供当前口令**。只凭一个有效 access token 就允许改密，
           等于把「15 分钟内被偷到的 access token」升级成「永久接管账号」。
        2. **改密与吊销在同一个数据库事务里完成**。分成两步时会出现
           「口令换了但攻击者会话仍有效」（用户以为已安全）或
           「会话全掉了但旧口令仍有效」两种半成品，都不可接受。
        3. **新旧口令必须不同**。允许改成一样会让用户产生「我已经改过了」
           的假安全感，而旧口令实际依旧有效。

        成功后该用户**全部** refresh token 被吊销（所有设备下线），
        access token 因不落库而无法逐个吊销，靠 15 分钟短 TTL 自然过期。
        客户端收到 204 后必须丢弃本地 token 并重新登录。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204':
          description: |
            口令已更新，该用户全部 refresh token 已吊销。
            客户端必须丢弃本地 token 并重新登录。
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: |
            未认证（缺 bearer / token 失效），或 `currentPassword` 校验失败
            （code=`invalid_credentials`）。后者与登录失败共用同一套
            「账号 + 来源 IP」失败计数，因此也可能返回 429。
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: 吊销该账号全部 refresh token（所有设备下线）
      description: |
        无请求体。与 `POST /v1/auth/logout` + `allDevices: true` 效果相同，
        但**不依赖客户端记得传参数**——一个不带 body 的 POST 就确定生效。

        安全动作不应该建立在「客户端传对了字段」之上：登出接口允许空 body，
        漏传 `allDevices` 时只会静默登出一台设备。
      responses:
        '204': { description: 全部会话已吊销 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me:
    get:
      tags: [auth]
      summary: 当前用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/devices:
    get:
      tags: [auth]
      summary: 设备列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /v1/books:
    get:
      tags: [books]
      summary: 书库列表
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
    post:
      tags: [books]
      summary: 创建书籍记录（随后上传文件）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }

  /v1/books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [books]
      summary: 书籍详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [books]
      summary: 更新元数据或阅读状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
    delete:
      tags: [books]
      summary: 删除书籍
      responses:
        '204': { description: 已删除 }

  /v1/books/{bookId}/file:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [books]
      summary: 上传书籍文件（幂等：按 contentHash 去重）
      parameters:
        - { name: contentHash, in: query, required: true, schema: { type: string }, description: 客户端计算的 sha256 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 已存在（去重命中）：该 contentHash 对应的文件已在此账号下，未重复写入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookFileUploadResult' }
        '201':
          description: 已上传：文件已落盘，书籍记录已绑定 storageKey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookFileUploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '507':
          $ref: '#/components/responses/QuotaExceeded'
          description: |
            存储配额耗尽（users.quota_bytes）。秒传（deduplicated=true）同样受配额约束：
            配额按「书架逻辑大小」计算，否则换个小号就能无限存书。
    get:
      tags: [books]
      summary: 下载书籍文件（支持 Range）
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206': { description: 部分内容 }

  /v1/sync/push:
    post:
      tags: [sync]
      summary: 推送本地变更（幂等，按 opId 去重）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: |
            整批全部拿到服务端裁决。每个 op 一定有一条 result，status 只会是 applied / duplicate / rejected。
            reason 只在裁决非平凡时出现（duplicate / older_hlc / stale_no_rewind 等），普通 applied 不带 reason。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '400':
          description: |
            整批被拒绝：至少一条 op 自身不合法（opId/entityId 非 UUID、entity/kind 未知、HLC 格式错误等）。
            该批**没有任何一条被写入**（无半成品状态），details.ops[] 逐条指出 index/opId/field/message。
            这是客户端数据问题，重试不会成功——必须先修正再重放整批。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/sync/pull:
    get:
      tags: [sync]
      summary: 拉取自 cursor 之后的变更（服务端权威结果）
      parameters:
        - name: cursor
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            严格大于该 seq 的变更才会返回（半开区间 cursor, +∞）。
            首次拉取传 0；之后每次都用上一次响应里的 cursor（不是 push 响应里的那个）。
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: |
            服务端权威变更页。cursor 是**本页最后一条变更的 seq**；hasMore=true 时立即用该 cursor 续拉。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }

  /v1/books/{bookId}/annotations:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [annotations]
      summary: 标注列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Annotation' }
    post:
      tags: [annotations]
      summary: 新建标注
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }

  /v1/annotations/{annotationId}:
    parameters:
      - { name: annotationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [annotations]
      summary: 更新标注
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationCreate' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [annotations]
      summary: 删除标注
      responses:
        '204':
          description: 已删除
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ai/translate:
    post:
      tags: [ai]
      summary: 流式翻译（SSE）
      description: |
        成本闸门：**在返回 200 与写入 SSE 之前**完成配额预扣。因此额度不足时
        得到的是标准 JSON 的 429，而不是一条已经开始吐字的流——一旦写了 200，
        HTTP 头就无法改回 429。

        每次调用都会记账（写 ai_usage），**失败与中途断开也记**：
        上游可能已经生成并计费了部分 token，不记就是账目缺口。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateRequest' }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            本周期配额已耗尽。**不要重试**：这不是限流，等到 resetAt 或提高配额才能恢复。
            `details.scope=global` 表示全站月度预算耗尽（换账号也没用）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaExceededError' }
        '503':
          description: AI 网关未配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/ai/jobs:
    get:
      tags: [ai]
      summary: 列出 AI 后台任务
      parameters:
        - { name: bookId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ai]
      summary: 提交后台 AI 任务（人名归一化、整书翻译等）
      description: |
        入队时预扣「1 次调用 + 一个保守的 token 估计」作为入场费。
        真实消耗由 worker 在**每个块处理前**逐块结算；超限时任务应置为 paused
        （可续跑）而不是 failed。也就是说入场预扣是占位，不是一次性买断。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiJobCreate' }
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: |
            本周期配额已耗尽，任务未被创建。
            `details.scope=global` 表示全站月度预算耗尽：此时任务**不入队**
            （而不是入队后等 worker 才发现超额），避免用户空等一个永远不会跑的任务。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaExceededError' }

  /v1/ai/usage:
    get:
      tags: [ai]
      summary: 查询本周期 AI 配额与用量
      description: |
        两个维度都返回：调用次数（防高频小请求）与 token 额度（防单次大任务）。
        判定时两个都要过，任一超限即 429。

        周期为**自然月（UTC 边界）**：所有实例对「本月」的判定一致，
        不会出现两台机器各算各的账。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ai/jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ai]
      summary: 查询任务状态
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }

  /v1/ai/jobs/{jobId}/chunks:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ai]
      summary: 获取整书翻译任务的分块结果
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [jobId, chunks]
                properties:
                  jobId: { type: string, format: uuid }
                  chunks:
                    type: array
                    items: { $ref: '#/components/schemas/TranslationChunk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sources:
    get:
      tags: [sources]
      summary: 列出已注册的合法书源
      description: |
        返回内置书源标识。全部为**合法公版 / 开放获取**资源：
        Project Gutenberg、Standard Ebooks、Open Library、Internet Archive。
        本项目**不含**通用抓取规则引擎，也不支持加载第三方书源。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceList' }

  /v1/sources/search:
    get:
      tags: [sources]
      summary: 合法书源搜索（Gutenberg / Standard Ebooks / Open Library / Internet Archive）
      description: |
        聚合搜索内置书源；不指定 source 时搜索全部并聚合结果，
        部分源失败不影响整体（错误放在 details 里）。

        **下载链的合法性判据在协议层**：OPDS 源只对带
        `http://opds-spec.org/acquisition/open-access` relation 的链接
        给出 downloadUrl。没有该 relation 的条目（借阅 / 试读 / 裸
        acquisition / Atom enclosure）**不会**出现在结果里 ——
        因此返回的每一条都可直接下载。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
        - name: source
          in: query
          schema: { type: string, enum: [gutenberg, standard-ebooks, open-library, internet-archive] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceItem' }
        '400':
          description: q 缺失 / 过长，或 source 未知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 上游书源不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/books/{bookId}/glossary:
    get:
      tags: [ai]
      summary: 读取术语表
      description: |
        返回一本书在某个目标语言下的全部术语。

        术语表的 **key 是归一化后的原文键**（如 `darcy`），不是原始写法。
        原因：同一人物会以多种写法出现（`Mr. Darcy` / `Darcy` / `达西先生`），
        若按原始写法存，同一个人会变成多条术语，译文一致性无从谈起。

        `display` 保留原始写法供展示，`target` 是标准译名。
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: targetLang
          in: query
          required: true
          description: 目标语言。必填而非默认 zh——猜语言会产生难以解释的行为。
          schema: { type: string, minLength: 1, maxLength: 16 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Glossary' }
        '400':
          description: bookId 非 UUID，或缺少 targetLang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [ai]
      summary: 批量写入 / 删除术语
      description: |
        **合并语义**，不是替换：只处理请求里出现的 key，未提及的术语保持不动。
        客户端因此可以只提交改动的那几条，不必回传整份术语表。

        **来源优先级**：已有术语是 `user_confirmed` 时，`llm_extracted` /
        `deterministic` 的写入会被忽略。用户手工确认的译名**重跑不得覆盖**。
        这关乎信任而非精度：用户改的译名被自动流水线冲掉，会认为功能不可靠。

        `key` 可省略，由服务端用归一化规则从 `display` 计算。
        客户端不应自行实现归一化——那是一套有版本的规则，重复实现必然不一致。

        每次成功写入或删除都会使 `version` 递增。`version` 参与译文缓存键：
        术语变了，受影响块必须重译，否则会复用基于旧术语的错误译文。

        写入同时进入同步通道（`book_config` 通道，
        entityId 形如 `glossary:<bookId>:<key>`），其它设备靠游标增量拉取。
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlossaryPutRequest' }
      responses:
        '200':
          description: 更新后的完整术语表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Glossary' }
        '400':
          description: bookId 非 UUID / 缺 targetLang / 术语缺 target / source 非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 请求内容不合法（客户端数据问题，重试不会成功）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 冲突（邮箱已注册 / deviceId 已绑定其它账号）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        限流或失败次数超限。**可以重试**，但必须等 details.retryAfter / Retry-After 头。
        与 quota_exceeded 的区别：这里的限制会随时间自动解除。
      headers:
        Retry-After: { schema: { type: integer }, description: 建议等待的秒数 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: |
        存储配额耗尽（HTTP 507）。与 429 的区别：重试不会成功，必须先删书或提高 users.quota_bytes。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 单个请求体超过上限（HPF_MAX_UPLOAD_BYTES）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 机器可读错误码 }
        message: { type: string, description: 人类可读说明 }
        details: { type: object, additionalProperties: true, description: 可选的附加信息 }
    GlossaryTerm:
      type: object
      required: [key, display, target, source]
      properties:
        key:
          type: string
          description: 归一化原文键（如 `darcy`）。用于去重与按 key 删除。
        display:
          type: string
          description: 展示用原始写法（保留大小写与尊称，如 `Mr. Darcy`）。
        target:
          type: string
          description: 标准译名。
        aliases:
          type: array
          items: { type: string }
        source:
          type: string
          enum: [user_confirmed, llm_extracted, deterministic]
          description: |
            术语来源。优先级 user_confirmed > llm_extracted > deterministic。
            `user_confirmed` 不会被自动流水线的重跑覆盖。

    Glossary:
      type: object
      required: [bookId, targetLang, version, terms]
      properties:
        bookId: { type: string, format: uuid }
        targetLang: { type: string }
        version:
          type: integer
          format: int64
          description: |
            每次术语变更递增。参与译文 input_hash：
            术语变了，受影响块必须重译。
        terms:
          type: array
          items: { $ref: '#/components/schemas/GlossaryTerm' }

    GlossaryPutRequest:
      type: object
      required: [targetLang]
      properties:
        targetLang: { type: string, minLength: 1, maxLength: 16 }
        terms:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/GlossaryTerm' }
        removeKeys:
          type: array
          items: { type: string }
          description: 要删除的归一 key。与 terms 合并成一个请求，避免「先删后写」之间出现空窗。

    LogoutRequest:
      type: object
      description: |
        两个字段都可选，因此空 body 是合法请求。
        - 只传 refreshToken：登出该设备；
        - 传 allDevices: true：登出该账号全部会话（忽略 refreshToken）。
      properties:
        refreshToken: { type: string, description: 要吊销的 refresh token 明文 }
        allDevices: { type: boolean, default: false, description: 吊销该账号全部 refresh token }

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: 当前口令。必须校验通过才允许改密（防「偷到 access token 即永久接管」）。
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
          description: |
            新口令。长度规则与注册完全一致（8~200），
            且必须与 currentPassword 不同（否则是「改了个寂寞」）。

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: access token 有效期（秒） }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    BookFileUploadResult:
      type: object
      description: |
        上传接口的响应体：200（去重命中 / 秒传）与 201（新写入）返回**同一结构**，
        只能用 deduplicated 区分，不要依赖状态码以外的差异。
        书籍与文件的绑定关系体现在该 bookId 资源上，不在响应里重复。
      required: [contentHash, sizeBytes, deduplicated]
      properties:
        contentHash: { type: string, description: 归一化后的 sha256:<64 hex> }
        sizeBytes: { type: integer, format: int64, description: 实际落盘字节数（与声明 hash 一致） }
        deduplicated:
          type: boolean
          description: 200 时为 true（服务端已有该 hash 的字节，秒传），201 时为 false（首次写入）

    Device:
      type: object
      required: [id, name, platform]
      description: |
        name 可为 null：设备名是可选信息，注册/登录时没提供就是 null。
        客户端应把 null 显示为「未命名设备」，不要与空字符串混淆。
      properties:
        id: { type: string, description: 设备 ID（HLC 前缀来源） }
        name: { type: string, nullable: true, description: 未提供设备名时为 null }
        platform: { type: string, enum: [web, windows, macos, linux, android, ios] }
        lastSeenAt: { type: string, format: date-time }

    Locator:
      type: object
      description: Readium Locator；引擎专有定位放在 locations.fragments
      required: [href, type]
      properties:
        href: { type: string, description: 章节/资源路径 }
        type: { type: string, description: 媒体类型，如 application/xhtml+xml }
        title: { type: string, nullable: true }
        locations:
          type: object
          properties:
            fragments:
              type: array
              items: { type: string }
              description: 引擎专有定位，例如 EPUB CFI
            progression: { type: number, minimum: 0, maximum: 1, description: 本章内进度 }
            position: { type: integer, minimum: 1 }
            totalProgression: { type: number, minimum: 0, maximum: 1, description: 全书进度 }
        text:
          type: object
          properties:
            before: { type: string }
            highlight: { type: string }
            after: { type: string }

    BookCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 512 }
        author: { type: string, nullable: true }
        language: { type: string, nullable: true }
        format: { type: string, enum: [epub, pdf, txt, mobi, azw3, fb2, cbz] }
        contentHash: { type: string, description: 文件 sha256，用于去重与多设备匹配 }

    BookUpdate:
      type: object
      properties:
        title: { type: string }
        author: { type: string, nullable: true }
        readingState: { type: string, enum: [unread, reading, finished, archived] }
        rating: { type: integer, minimum: 0, maximum: 5, nullable: true }

    Book:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string, nullable: true }
        language: { type: string, nullable: true }
        format: { type: string, nullable: true }
        contentHash: { type: string, nullable: true }
        sizeBytes: { type: integer, format: int64, nullable: true }
        readingState: { type: string, enum: [unread, reading, finished, archived] }
        progress: { $ref: '#/components/schemas/ReadingProgress' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        nextCursor: { type: string, nullable: true }

    ReadingProgress:
      type: object
      description: 服务端权威的阅读进度
      properties:
        locator: { $ref: '#/components/schemas/Locator' }
        furthestLocator:
          allOf: [{ $ref: '#/components/schemas/Locator' }]
          description: 历史最远位置（不受回退影响）
        totalProgression: { type: number, minimum: 0, maximum: 1 }
        explicitRewind: { type: boolean, description: 用户主动回退标记 }
        hlc: { type: string, description: 该值的 HLC }
        deviceId: { type: string }
        updatedAt: { type: string, format: date-time }

    SyncOp:
      type: object
      description: 一次幂等变更操作
      required: [opId, entity, entityId, kind, hlc]
      properties:
        opId: { type: string, description: UUID v7，幂等键（服务端保留 7 天） }
        entity: { type: string, enum: [progress, annotation, book, book_config] }
        entityId: { type: string }
        bookId: { type: string, nullable: true }
        kind: { type: string, enum: [upsert, delete] }
        hlc: { type: string }
        deviceId: { type: string }
        payload: { type: object, additionalProperties: true }

    SyncPushRequest:
      type: object
      required: [deviceId, ops]
      properties:
        deviceId: { type: string }
        ops:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/SyncOp' }

    SyncPushResponse:
      type: object
      required: [results, cursor]
      properties:
        results:
          type: array
          items:
            type: object
            required: [opId, status]
            properties:
              opId: { type: string, format: uuid }
              status: { type: string, enum: [applied, duplicate, rejected] }
              reason:
                type: string
                nullable: true
                description: |
                  可选字段，只在裁决非平凡时出现，普通 applied 不带它（不是必填，客户端不要依赖它存在）：
                    - applied + newer_hlc / explicit_rewind / monotonic_forward / new_entity
                    - duplicate（幂等命中，重复的 opId）
                    - rejected + older_hlc / stale_no_rewind / tombstone_wins（以及 rejected:&lt;原因&gt; 形式）
        cursor:
          type: integer
          format: int64
          description: |
            **推送提交后的服务端游标**，不是下一次 pull 的起始游标。
            语义：本批提交成功后 change_log 的最大 seq；整批没有任何写入时等于该用户当前的 MAX(seq)。
            客户端应保存「最近一次 pull 响应里的 cursor」用于续拉；
            push 返回的 cursor 只用于观察进度，直接拿它去 pull 会跳过尚未拉取的变更。

    SyncChange:
      type: object
      required: [cursor, entity, entityId, kind, hlc]
      properties:
        cursor: { type: integer, format: int64 }
        entity: { type: string, enum: [progress, annotation, book, book_config] }
        entityId: { type: string }
        bookId: { type: string, nullable: true }
        kind: { type: string, enum: [upsert, delete] }
        hlc: { type: string }
        deviceId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }

    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        nextCursor:
          type: integer
          format: int64
          description: |
            下一页起点 = 本页最后一条变更的 seq（无变更时等于请求里的 cursor）。
            直接作为下一次请求的 cursor 传入，不要自行 +1。
        hasMore: { type: boolean, description: true 表示还有更多变更，应立即用 nextCursor 续拉 }

    AnnotationCreate:
      type: object
      required: [locator, type]
      properties:
        locator: { $ref: '#/components/schemas/Locator' }
        type: { type: string, enum: [highlight, underline, note, bookmark] }
        color: { type: string, nullable: true }
        note: { type: string, nullable: true }
        text: { type: string, nullable: true, description: 被标注的原文 }

    Annotation:
      allOf:
        - $ref: '#/components/schemas/AnnotationCreate'
        - type: object
          required: [id, bookId, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            bookId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    TranslateRequest:
      type: object
      required: [text, targetLang]
      properties:
        text: { type: string, maxLength: 20000 }
        targetLang: { type: string, example: zh-CN }
        sourceLang: { type: string, nullable: true }
        bookId: { type: string, nullable: true }
        context: { type: string, nullable: true, description: 上文片段，用于保持术语一致 }

    AiJobCreate:
      type: object
      required: [kind, bookId]
      properties:
        kind: { type: string, enum: [entity_normalize, book_translate, summarize] }
        bookId: { type: string, format: uuid }
        options: { type: object, additionalProperties: true }

    AiJob:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [entity_normalize, book_translate, summarize] }
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled, paused]
          description: |
            `paused` 与 `failed` 的区别是**可续跑性**：
            `paused` 表示额度耗尽，已完成的工作（块级译文）全部保留，
            额度恢复后（下个周期）可继续；`failed` 表示需要用户重新发起。
            配额超限必须用 `paused`——用 `failed` 会让用户以为任务坏了，
            且白扔掉已经付过费的进度。
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: |
            按**已完成块数 / 总块数**算出，不是 worker 自增计数器。
            计数器在崩溃后会归零，导致进度条倒退、用户误以为重头开始。
        result: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }

    BookTranslateResult:
      type: object
      description: |
        `book_translate` 任务的 result。

        块级状态落库在 `book_translation_chunks`，因此任务中断重启后
        会从**第一个未完成的块**继续，已完成的块永不重译（`input_hash` 未变即可复用）。
      required: [targetLang, model, totalChunks, doneChunks, translatedChars]
      properties:
        targetLang: { type: string }
        model: { type: string, description: 实际使用的模型标识，例如 `openai:deepseek-chat` }
        totalChunks: { type: integer, description: 块总数（按章节 + 约 6000 token 切分） }
        doneChunks: { type: integer, description: 已完成块数 }
        translatedChars: { type: integer, description: 译文总字符数（用于成本核对） }
        reusedChunks: { type: integer, description: 因 `input_hash` 命中而复用的块数（不重复计费） }
        paused: { type: boolean, description: 因配额耗尽而暂停（可续跑） }
        consistency: { $ref: '#/components/schemas/ConsistencyScan' }

    ConsistencyScan:
      type: object
      description: |
        译后确定性扫描结果（零 LLM 成本）。

        对每个标准译名，用**纯字符串统计**检查它在译文里出现的次数：
        出现 0 次即判定该段忽略了术语表。这把「祈祷模型听话」变成可验证断言。

        判定刻意保守：只查「该用没用」，不查「用了但用错」（后者需语义理解）；
        也只检查原文里真的出现过的术语，否则必然误报。
      required: [checkedTerms, violatingChunks]
      properties:
        checkedTerms: { type: integer, description: 实际检查过的术语数（原文里出现过的） }
        violatingChunks: { type: integer, description: 存在违规的块数（按块计，不是按术语计） }
        violations:
          type: array
          description: 违规明细。块序号可用于只重译该段，而不必重跑整本书。
          items:
            type: object
            required: [chunkIndex, source, target]
            properties:
              chunkIndex: { type: integer }
              source: { type: string, description: 原文写法 }
              target: { type: string, description: 标准译名（译文中未出现） }

    TranslationChunk:
      type: object
      description: 整书翻译任务的单个文本块与译文。
      required: [chunkIndex, chapterIndex, sourceText, status]
      properties:
        chunkIndex: { type: integer, description: 块全局序号 }
        chapterIndex: { type: integer, description: 章节序号 }
        sourceText: { type: string, description: 原文 }
        outputText: { type: string, nullable: true, description: 译文 }
        status: { type: string, enum: [pending, running, done, failed] }

    QuotaDimension:
      type: object
      description: 一个配额维度的用量。
      required: [used, quota, remaining]
      properties:
        used: { type: integer, format: int64, description: 本周期已用量 }
        quota: { type: integer, format: int64, description: 本周期配额上限 }
        remaining: { type: integer, format: int64, minimum: 0 }

    AiUsage:
      type: object
      description: |
        两个维度都返回。判定时两个都要过，任一超限即 429——
        只按调用次数计费会严重失真：划词翻译一次约 2000 字（成本几厘钱），
        整书翻译一次约 48 万 token（约 1~2 元），两者都算「1 次调用」。
      required: [periodStart, resetAt, calls, tokens]
      properties:
        periodStart: { type: string, format: date-time, description: 本周期起点（UTC 自然月首） }
        resetAt: { type: string, format: date-time, description: 额度重置时刻（下一个月首） }
        calls: { $ref: '#/components/schemas/QuotaDimension' }
        tokens: { $ref: '#/components/schemas/QuotaDimension' }
        usage:
          type: object
          description: 本周期实际记账汇总（按 feature），用于核对配额消耗与真实成本是否一致。
          additionalProperties:
            type: object
            properties:
              calls: { type: integer, format: int64 }
              inputTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              costCents: { type: integer, format: int64, description: 按官方单价折算，单位：分 }

    QuotaExceededError:
      type: object
      description: |
        配额耗尽。**这不是限流**：重试不会成功，必须等 resetAt 或提高配额。
        code 与 rate_limited 刻意分开，避免客户端做出错误的重试决策。
      required: [code, message, details]
      properties:
        code: { type: string, enum: [quota_exceeded] }
        message: { type: string }
        details:
          type: object
          required: [dimension, limit, used, resetAt]
          properties:
            dimension:
              type: string
              enum: [calls, tokens]
              description: |
                哪个维度超了。calls = 调用次数用完（高频小请求）；
                tokens = token 额度用完（通常是跑了整书翻译这类大任务）。
            scope:
              type: string
              enum: [user, global]
              default: user
              description: |
                谁的上限被撞到了。

                - `user`：你自己的月度额度用完。等 resetAt 或提高
                  `users.quota_ai_calls` / `users.quota_ai_tokens`。
                - `global`：**全站**月度调用预算用完
                  （`HPF_AI_GLOBAL_MONTHLY_CALLS`）。这与你的用量无关，
                  **换账号也不会恢复**——不要引导用户去注册小号，
                  那既没用又会让攻击面变大。只能等 resetAt。

                缺省视为 `user`（老服务端不返回该字段）。
            limit: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            resetAt: { type: string, format: date-time }

    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { type: string }
          example: [gutenberg, standard-ebooks, open-library, internet-archive]

    SourceItem:
      type: object
      required: [source, title, downloadUrl, license]
      properties:
        source: { type: string, example: gutenberg }
        title: { type: string }
        author: { type: string, nullable: true }
        language: { type: string, nullable: true }
        downloadUrl:
          type: string
          format: uri
          description: |
            可直接下载的地址。**仅当**条目具有可验证的开放获取依据时才存在：
            - OPDS 源：必须带 `http://opds-spec.org/acquisition/open-access` relation
            - 内置 Gutenberg：由我们核实为公有领域
            没有依据的条目不会出现在结果里（而不是给一个空值）。
        coverUrl: { type: string, format: uri, nullable: true }
        license:
          type: string
          enum: [public-domain, open-access, mixed-open-access, cc0, unknown]
          description: |
            授权标识。
            - public-domain：公有领域（已核实）
            - open-access：OPDS 协议声明的开放获取
            - mixed-open-access：源内混合公版与借阅，条目级以 open-access relation 为准
            - unknown：未能核实（不应出现在下载结果里）
        extra:
          type: object
          additionalProperties: true
          description: 源站排障信息（例如 OPDS relation 与 MIME 类型）

security:
  - bearerAuth: []